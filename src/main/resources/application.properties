spring.application.name=SmartSpace

# MySQL Config
spring.datasource.url=jdbc:mysql://localhost:3306/smartspace_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server
server.port=8080

# JWT authentication
smartspace.jwt.secret=${SMARTSPACE_JWT_SECRET}
smartspace.jwt.expiration-ms=3600000